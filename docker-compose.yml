services:
  # MongoDB container
  mongodb:
    image: mongodb/mongodb-community-server:7.0.0-ubi8
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - wikinsert-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart:
      always

  # Python data population container
  python-populator:
    build:
      context: .
      dockerfile: scripts/Dockerfile
    container_name: python-populator
    volumes:
      - pip-cache:/pip-cache
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - wikinsert-network
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - DB_NAME=wikinsert

  # Ktor API container
  ktor-api:
    build:
      context: ./wikinsert-au/backend
      dockerfile: Dockerfile
    container_name: ktor-api
    ports:
      - "8081:8080"
    depends_on:
      python-populator:
        condition: service_completed_successfully
    networks:
      - wikinsert-network
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/
      - MONGODB_DATABASE=wikinsert
    restart:
      always

networks:
  wikinsert-network:
    driver: bridge

volumes:
  mongodb_data:
  pip-cache:
